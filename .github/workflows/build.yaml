name: Build GoFormat

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # lets the release workflow run the same checks and builds
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Check Formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Build Binaries
      run: |
        # reported by -version: the tag on a release, the commit otherwise
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          version=$GITHUB_REF_NAME
        else
          version="dev-${GITHUB_SHA::7}"
        fi
        build() {
          GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w -X main.version=$version" -o "bin/$3" .
        }
        build windows amd64 goformat-windows-amd64.exe
        build linux   amd64 goformat-linux-amd64
        build linux   arm64 goformat-linux-arm64
        build darwin  arm64 goformat-macos-arm64
        build darwin  amd64 goformat-macos-amd64

    - name: Upload Binaries
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: bin/
        if-no-files-found: error
        retention-days: 7
