name: Release GoFormat

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # the same checks and builds as every push, so a release cannot skip them
  build:
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Binaries
      uses: actions/download-artifact@v8
      with:
        name: binaries
        path: bin

    - name: Generate Checksums
      run: cd bin && sha256sum * > checksums.txt

    # created as a draft so the notes can be reviewed before publishing
    - name: Create Draft Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release create "$GITHUB_REF_NAME" bin/* --draft --title "$GITHUB_REF_NAME" --generate-notes
